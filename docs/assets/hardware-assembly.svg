<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="'Hiragino Sans', 'Noto Sans JP', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c62828"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1f6feb"/>
    </marker>
  </defs>

  <!-- background (explicit, so the figure stays readable in GitHub dark mode) -->
  <rect x="0" y="0" width="920" height="560" rx="8" fill="#ffffff" stroke="#d0d7de"/>

  <!-- title -->
  <text x="460" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292f">ノード組み立て図(アンカー・タグ共通の基本ユニット)</text>

  <!-- ===== power sources (left column) ===== -->
  <!-- LiPo battery (tag) -->
  <rect x="50" y="120" width="140" height="56" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <rect x="190" y="138" width="8" height="20" fill="#c62828"/>
  <text x="120" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">LiPo 3.7 V</text>
  <text x="120" y="161" text-anchor="middle" font-size="12" fill="#c62828">500〜1000 mAh</text>
  <text x="120" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">タグ構成(×2〜5)</text>
  <path d="M198,148 C240,148 250,180 278,196" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="212" y="180" font-size="11" fill="#c62828">BAT 端子へ</text>

  <!-- USB power (anchor) -->
  <rect x="50" y="330" width="140" height="56" rx="8" fill="#eaf1fd" stroke="#1f6feb" stroke-width="2"/>
  <text x="120" y="353" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f6feb">USB AC アダプタ /</text>
  <text x="120" y="371" text-anchor="middle" font-size="12" fill="#1f6feb">モバイルバッテリー</text>
  <text x="120" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f6feb">アンカー構成(×8〜12)</text>
  <path d="M190,375 C260,395 290,400 328,392" fill="none" stroke="#1f6feb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="180" y="428" font-size="11" fill="#1f6feb">USB Type-C(5 V)</text>

  <!-- ===== M5Stamp C5 board ===== -->
  <rect x="280" y="140" width="140" height="240" rx="6" fill="#37474f" stroke="#263238" stroke-width="2"/>
  <text x="350" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">M5Stamp C5</text>
  <text x="350" y="194" text-anchor="middle" font-size="12" fill="#cfd8dc">(ESP32-C5)</text>
  <text x="350" y="216" text-anchor="middle" font-size="11" fill="#cfd8dc">Wi-Fi 2.4/5 GHz</text>
  <!-- BAT pads -->
  <circle cx="288" cy="206" r="5" fill="#ffc107" stroke="#8d6e63"/>
  <circle cx="288" cy="224" r="5" fill="#ffc107" stroke="#8d6e63"/>
  <text x="300" y="240" font-size="11" fill="#ffe082">BAT 端子</text>
  <text x="300" y="255" font-size="10" fill="#b0bec5">(充電 IC 内蔵)</text>
  <!-- FPC connector -->
  <rect x="404" y="230" width="16" height="60" fill="#111111" stroke="#616161"/>
  <!-- USB-C port -->
  <rect x="332" y="372" width="36" height="14" rx="6" fill="#90a4ae" stroke="#546e7a"/>
  <text x="350" y="404" text-anchor="middle" font-size="10" fill="#57606a">USB-C(給電・書き込み)</text>

  <!-- ===== FPC cable ===== -->
  <path d="M420,244 C450,244 450,238 480,238 L480,282 C450,282 450,276 420,276 z" fill="#f6a821" stroke="#c77d00"/>
  <line x1="450" y1="284" x2="450" y2="428" stroke="#c77d00" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="450" y="448" text-anchor="middle" font-size="12" font-weight="bold" fill="#c77d00">0.5mm-12P FPC ケーブル(付属)</text>
  <text x="450" y="466" text-anchor="middle" font-size="11" fill="#c77d00">背面コネクタに挿してロックするだけ(はんだ付け不要)</text>

  <!-- ===== Stamp UWB F board ===== -->
  <rect x="480" y="100" width="150" height="300" rx="6" fill="#37474f" stroke="#263238" stroke-width="2"/>
  <!-- antenna zone -->
  <rect x="488" y="108" width="134" height="56" rx="4" fill="#eceff1" stroke="#90a4ae" stroke-dasharray="5 4"/>
  <text x="555" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#455a64">アンテナ部</text>
  <text x="555" y="150" text-anchor="middle" font-size="10" fill="#607d8b">(UWB Ch9 7.9872 GHz)</text>
  <text x="555" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Stamp UWB F</text>
  <text x="555" y="210" text-anchor="middle" font-size="12" fill="#cfd8dc">(FPC 版)</text>
  <!-- chip -->
  <rect x="520" y="240" width="70" height="50" fill="#111111" stroke="#616161"/>
  <text x="555" y="270" text-anchor="middle" font-size="11" fill="#ffffff">QM33120W</text>
  <!-- FPC connector on UWB side -->
  <rect x="480" y="230" width="14" height="60" fill="#111111" stroke="#616161"/>
  <!-- keep-clear note -->
  <path d="M622,136 C660,136 660,120 700,120" fill="none" stroke="#c62828" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="706" y="116" font-size="12" font-weight="bold" fill="#c62828">アンテナ端は金属・壁から</text>
  <text x="706" y="132" font-size="12" font-weight="bold" fill="#c62828">離して突き出すよう取付</text>
  <text x="706" y="148" font-size="11" fill="#c62828">(金属板への直付けは禁止)</text>

  <!-- ===== pin mapping panel ===== -->
  <rect x="660" y="180" width="230" height="150" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="676" y="206" font-size="14" font-weight="bold" fill="#24292f">FPC 結線(公式ピン割当と一致)</text>
  <text x="676" y="232" font-size="12" fill="#24292f">SPI: SCK=G12 / MISO=G26</text>
  <text x="700" y="250" font-size="12" fill="#24292f">MOSI=G27 / CS=G11</text>
  <text x="676" y="274" font-size="12" fill="#24292f">制御: RST=G25 / IRQ=G0</text>
  <text x="676" y="298" font-size="12" fill="#24292f">電源: 3V3・GND も FPC に集約</text>
  <text x="676" y="318" font-size="11" fill="#57606a">→ 公式サンプルがそのまま動く</text>

  <!-- ===== assembly steps panel ===== -->
  <rect x="660" y="350" width="230" height="150" rx="6" fill="#fff8f0" stroke="#e8d5b5"/>
  <text x="676" y="376" font-size="14" font-weight="bold" fill="#24292f">組み立て手順</text>
  <text x="676" y="400" font-size="12" fill="#24292f">1. FPC を両コネクタに挿してロック</text>
  <text x="676" y="422" font-size="12" fill="#24292f">2. 電源接続(タグ=LiPo /</text>
  <text x="694" y="440" font-size="12" fill="#24292f">アンカー=USB-C 常時給電)</text>
  <text x="676" y="462" font-size="12" fill="#24292f">3. USB-C で FW 書き込み</text>
  <text x="676" y="484" font-size="12" fill="#24292f">4. ケース・取付具へ(アンテナ露出)</text>

  <!-- ===== legend ===== -->
  <g font-size="12" fill="#24292f">
    <rect x="50" y="510" width="13" height="13" fill="#37474f" stroke="#263238"/>
    <text x="69" y="521">共通部品(全ノード)</text>
    <rect x="210" y="510" width="13" height="13" fill="#fdecea" stroke="#c62828"/>
    <text x="229" y="521">タグのみ</text>
    <rect x="310" y="510" width="13" height="13" fill="#eaf1fd" stroke="#1f6feb"/>
    <text x="329" y="521">アンカーのみ</text>
    <text x="440" y="521" fill="#57606a">※ アンカー・タグはファームウェアと電源が違うだけで、基板構成は同一。</text>
  </g>
</svg>
