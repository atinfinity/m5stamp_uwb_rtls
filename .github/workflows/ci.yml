name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --all-extras
      - name: Test
        run: uv run pytest -q

  firmware-native:
    # rtls_common (スロット判定・JSON 生成/解析) のホストテスト — 実機・ツールチェーン不要
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run native tests
        run: ./firmware/test_native/run.sh
