name: Firmware build

# ESP32-C5 向けビルドは 1 ジョブ数分かかるため、firmware/ 配下のコードを
# 変更したときだけ実行する (ドキュメントのみの変更では走らせない)
on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "!firmware/**/*.md"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "!firmware/**/*.md"
      - ".github/workflows/firmware.yml"

jobs:
  firmware:
    # FW のビルドチェック (pio run はコンパイルのみ)。board 定義
    # esp32-c5-devkitc-1 で M5Stamp C5 に書き込み・起動できることを実機で
    # 確認済み (Issue #54) なので、失敗はそのまま CI の失敗にする。
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [firmware/anchor, firmware/tag, firmware/tdoa_poc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        # firmware/ が存在しないブランチ (サーバー側のみの PR など) ではスキップ
        run: |
          if [ -d "${{ matrix.project }}" ]; then
            pio run -d "${{ matrix.project }}"
          else
            echo "skip: ${{ matrix.project }} not present on this branch"
          fi
