name: Firmware build

# ESP32-C5 向けビルドは 1 ジョブ数分かかるため、firmware/ 配下のコードを
# 変更したときだけ実行する (ドキュメントのみの変更では走らせない)
on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "!firmware/**/*.md"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "!firmware/**/*.md"
      - ".github/workflows/firmware.yml"

jobs:
  firmware:
    # 実機レス期間の FW ビルドチェック (pio run はコンパイルのみ)。
    # ESP32-C5 の pioarduino board 定義は実機未検証のため、当面は失敗を
    # ブロッカーにしない (検証後に continue-on-error を外す)。
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        project: [firmware/anchor, firmware/tag, firmware/tdoa_poc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        # firmware/ が存在しないブランチ (サーバー側のみの PR など) ではスキップ
        run: |
          if [ -d "${{ matrix.project }}" ]; then
            pio run -d "${{ matrix.project }}"
          else
            echo "skip: ${{ matrix.project }} not present on this branch"
          fi
