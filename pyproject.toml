[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m5stamp-uwb-rtls-server"
version = "0.1.0"
description = "Positioning server (Plan A) for M5Stamp UWB RTLS"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
mqtt = ["aiomqtt>=2.0"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12"]

[dependency-groups]
dev = ["pytest>=8.0", "httpx2"]

[tool.setuptools.packages.find]
include = ["server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
