; アンカー FW — M5Stamp C5 + Stamp UWB F
; ESP32-C5 の Arduino サポートは pioarduino 版 platform-espressif32 を使用
; env:anchor = DS-TWR (既定) / env:anchor_ss = SS-TWR 検証用 (Issue #14)
[platformio]
default_envs = anchor

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = https://github.com/m5stack/M5Stamp-UWB.git
lib_extra_dirs = ../lib

[env:anchor]
; 個体ごとにアドレスを差し替えてビルドする (rtls-design.md §4.2)
build_flags = -DNODE_ADDR=0x0010

[env:anchor_ss]
build_flags =
    -DNODE_ADDR=0x0010
    -DUSE_SS_TWR
