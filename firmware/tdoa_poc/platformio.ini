; TDoA PoC ファームウェア (Issue #16 / tdoa-design.md §6)
;   env:blink_tx  = 周期ブリンク送信 (マスターアンカー/タグの模擬)
;   env:listener  = 受信 + SDK 直叩きで RX タイムスタンプを CSV 出力
; コンパイルが通ること自体が PoC-1 の前段検証 (qm33120w_sdk のシンボルへ到達できるか)
[platformio]
default_envs = listener

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino
monitor_speed = 115200
; M5Stamp C5 は USB-Serial/JTAG で PC と直結しているため、Serial を USB 側へ出す
; (未指定だと UART0 に出て、USB のシリアルモニタには何も表示されない。Issue #54)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = https://github.com/m5stack/M5Stamp-UWB.git#v0.1.1
lib_extra_dirs = ../lib

[env:listener]
build_src_filter = +<main_listener.cpp>
build_flags =
    ${env.build_flags}
    -DNODE_ADDR=0x0020

[env:blink_tx]
build_src_filter = +<main_blink.cpp>
build_flags =
    ${env.build_flags}
    -DNODE_ADDR=0x00F0
    -DBLINK_INTERVAL_MS=100
