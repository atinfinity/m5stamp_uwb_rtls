; タグ FW — M5Stamp C5 + Stamp UWB F
; env:tag       = 本番モード (アンカー巡回 + TDMA + Wi-Fi/MQTT)  → src/main_prod.cpp
; env:tag_step1 = Step 1 計測モード (1対1 DS-TWR + CSV 出力)     → src/main_step1.cpp
[platformio]
default_envs = tag

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../lib

[env:tag]
build_src_filter = +<main_prod.cpp>
lib_deps =
    https://github.com/m5stack/M5Stamp-UWB.git
    knolleary/PubSubClient@^2.8
build_flags =
    -DNODE_ADDR=0x0001
    -DWIFI_SSID=\"rtls-ap\"
    -DWIFI_PASS=\"rtls-pass\"
    -DMQTT_HOST=\"192.168.1.10\"

[env:tag_step1]
build_src_filter = +<main_step1.cpp>
lib_deps = https://github.com/m5stack/M5Stamp-UWB.git
build_flags =
    -DNODE_ADDR=0x0001
    -DTARGET_ANCHOR=0x0010
    -DRANGE_INTERVAL_MS=50

; SS-TWR 検証用 (Issue #14)。アンカー側も env:anchor_ss で揃えること
[env:tag_step1_ss]
build_src_filter = +<main_step1.cpp>
lib_deps = https://github.com/m5stack/M5Stamp-UWB.git
build_flags =
    -DNODE_ADDR=0x0001
    -DTARGET_ANCHOR=0x0010
    -DRANGE_INTERVAL_MS=50
    -DUSE_SS_TWR
