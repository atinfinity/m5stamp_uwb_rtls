; タグ FW (Step 1: DS-TWR 計測モード) — M5Stamp C5 + Stamp UWB F
[env:tag]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = https://github.com/m5stack/M5Stamp-UWB.git
lib_extra_dirs = ../lib
build_flags =
    -DNODE_ADDR=0x0001
    -DTARGET_ANCHOR=0x0010
    -DRANGE_INTERVAL_MS=50
